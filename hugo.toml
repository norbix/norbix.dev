baseURL = 'https://norbix.dev/'
languageCode = "en-us"
title = "norbix.dev"
theme = "PaperMod"
defaultContentLanguage = "en"
buildDrafts = false
buildFuture = true
buildExpired = false

[pagination]
pagerSize = 10

[params]
defaultTheme = "dark" # or "light" or "auto"
ShowHomeInNavbar = true

# Your social media
social = [
    { name = "github", url = "https://github.com/norbix" },
    { name = "twitter", url = "https://x.com/norbixjakubczak" },
    { name = "email", url = "mailto:norbert.jakubczak@gmail.com" }
]

author = "Norbix"
description = "norbix.dev - Norbix's dev blog"
DateFormat = "2006-01-02"
ShowReadingTime = true
ShowShareButtons = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowWordCount = true
ShowToc = true
TocOpen = false
comments = true

[params.giscus]
repo = "norbix/norbix.dev"
repo_id = "R_kgDOOV_xMQ"
category = "Announcements"
category_id = "DIC_kwDOOV_xMc4CpF5M"
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "bottom"
theme = "dark"
lang = "en"

# Homepage copy; markup lives in layouts/index.html.
[params.homepage]
name = "Norbert Jakubczak"
role = "Software Engineer · Technology Partner"
headline = "Think **independently.** Build **deliberately.**"
description = "Engineering notes on software systems, architecture, and the decisions behind them."
avatar = "images/my_avatar-transparent.png"
avatarAlt = "Gold Spartan helmet — Norbert Jakubczak's avatar"
topics = ["Distributed Systems", "Go", "Python", "TypeScript", "AWS", "Kubernetes"]
latestTitle = "Latest posts"
allPostsLabel = "View all posts"
postsURL = "/posts/"

[[params.homepage.links]]
name = "Read the notes"
url = "/posts/"

[[params.homepage.links]]
name = "About me"
url = "/about/"

[[params.homepage.links]]
name = "Work with me"
url = "/about/#-work-with-me"

# Menus (top nav)
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 30

[[menu.main]]
identifier = "rss"
name = "📡 RSS"
url = "/index.xml"
weight = 40

# Syntax highlighting
[markup]
[markup.highlight]
noClasses = false
style = "monokai" # Other options: dracula, github-dark, etc.
lineNos = true
lineNumbersInTable = true
[markup.goldmark.renderer]
unsafe = true # Allow raw HTML in Markdown

# Outputs (enable RSS and search if needed)
[outputs]
home = ["HTML", "RSS", "JSON"]

# Deployment base (for future production)
[deployment]
[[deployment.targets]]
name = "live"
URL = "s3://your-bucket-name?region=your-region"

# Sitemap settings
[sitemap]
changefreq = "monthly"
filename = "sitemap.xml"
priority = 0.5

# Table of Contents settings
#[markup.tableOfContents]
#startLevel = 2
#endLevel = 5
#ordered = true
